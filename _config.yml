# GitHub Pages configuration for PoC Research Papers

title: "PoC Research Papers"
description: "A curated collection of academic research papers on Proof-of-Concept exploits"
url: "https://marklee131.github.io"
baseurl: "/PoC-Research-Papers"

# SEO
lang: en-US
author: "Kaixuan Li"

# GitHub metadata
github:
  is_project_page: true
  repository_name: "PoC-Research-Papers"

# Plugins
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-seo-tag

# README.md has no front matter, so give every page the ledger layout explicitly.
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge


# Exclude from processing
exclude:
  - .gitignore
  - LICENSE
