<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F3EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111419" media="(prefers-color-scheme: dark)">
  {% seo %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23171F2B'/%3E%3Crect x='7' y='8' width='18' height='2' fill='%23F5F3EC'/%3E%3Crect x='7' y='14' width='18' height='2' fill='%23F5F3EC'/%3E%3Crect x='7' y='20' width='10' height='2' fill='%23F5F3EC'/%3E%3Ccircle cx='23' cy='21' r='4' fill='%23B23A2C'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300..700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    document.documentElement.className = 'js';
    try {
      var t = localStorage.getItem('poc-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    // If ledger.js never lands, show the plain rendered markdown rather than nothing.
    setTimeout(function () {
      var md = document.getElementById('md');
      if (md) md.classList.add('ready');
    }, 2500);
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to papers</a>

  <div id="md" class="md raw">
    {{ content }}
  </div>

  <script src="{{ '/assets/js/ledger.js' | relative_url }}" defer></script>
</body>
</html>
